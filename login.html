<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudSense — Sign In</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☁️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="login-body">

  <!-- Animated background orbs -->
  <div class="login-bg" aria-hidden="true">
    <div class="login-bg-orb orb-1"></div>
    <div class="login-bg-orb orb-2"></div>
    <div class="login-bg-orb orb-3"></div>
  </div>

  <div class="login-container">
    <div class="login-card">

      <!-- Theme toggle -->
      <button class="login-theme-btn" id="loginThemeBtn" aria-label="Toggle theme">
        <span id="loginThemeIcon">🌙</span>
      </button>

      <!-- Header -->
      <div class="login-header">
        <div class="login-logo">
          <svg width="52" height="52" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="lgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#7c6ff7"/>
                <stop offset="100%" stop-color="#00d9d4"/>
              </linearGradient>
            </defs>
            <path d="M48 40H20C14.5 40 10 35.5 10 30C10 25 13.8 20.8 18.7 20.1C19.8 14.4 24.9 10 31 10C37.4 10 42.7 14.8 43.5 21C47.1 21.7 50 24.9 50 28.8C50 34.9 46.6 40 48 40Z" fill="url(#lgGrad)" opacity="0.85"/>
            <path d="M50 40H26C21.6 40 18 36.4 18 32C18 28 20.9 24.6 24.7 24C25.6 19.5 29.7 16 34.5 16C39.6 16 43.9 19.8 44.5 24.8C47.6 25.3 50 28 50 31.2C50 34.9 52 40 50 40Z" fill="url(#lgGrad)"/>
          </svg>
        </div>
        <h1 class="login-title">CloudSense</h1>
        <p class="login-subtitle" id="loginSubtitle">Sign in to your admin panel</p>
      </div>

      <!-- Error message -->
      <div class="form-error hidden" id="formError"></div>

      <!-- Email/Password Form -->
      <form class="login-form" id="loginForm" novalidate>
        <!-- Name (sign-up only) -->
        <div class="form-group hidden" id="nameGroup">
          <label class="form-label" for="nameInput">Full Name</label>
          <div class="input-wrapper">
            <span class="input-icon">👤</span>
            <input type="text" id="nameInput" class="form-input" placeholder="Your name" autocomplete="name" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="emailInput">Email Address</label>
          <div class="input-wrapper">
            <span class="input-icon">✉️</span>
            <input type="email" id="emailInput" class="form-input" placeholder="admin@company.com" autocomplete="email" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordInput">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">🔒</span>
            <input type="password" id="passwordInput" class="form-input" placeholder="Enter your password" autocomplete="current-password" />
          </div>
        </div>

        <button type="submit" class="login-submit-btn" id="submitBtn">
          <span class="btn-text" id="btnText">Sign In</span>
          <span class="btn-loader hidden" id="btnLoader"><span class="spinner"></span></span>
        </button>

        <button type="button" class="forgot-password-btn" id="forgotBtn">Forgot password?</button>
      </form>

      <!-- OR Divider -->
      <div class="auth-divider">
        <span class="auth-divider-line"></span>
        <span class="auth-divider-text">or</span>
        <span class="auth-divider-line"></span>
      </div>

      <!-- Google Sign-In -->
      <button class="google-signin-btn" id="googleSignInBtn">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>

      <!-- Toggle login / signup -->
      <div class="login-toggle">
        <span class="toggle-text" id="toggleText">Don't have an account?</span>
        <button class="toggle-btn" id="toggleBtn" type="button">Create Account</button>
      </div>
    </div>

    <p class="login-footer">© 2026 CloudSense</p>
  </div>

  <script type="module" src="/src/login.js"></script>
</body>
</html>
